name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install pinned Windows development requirements
        run: python -m pip install -r requirements/windows-build.lock.txt
      - name: Allow symlink tests on the disposable hosted runner
        shell: powershell
        run: |
          $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $path -Force | Out-Null
          New-ItemProperty -Path $path -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Unit, Core and integration tests
        run: python build.py test
      - name: Source UI smoke
        run: python tests/smoke.py
      - name: Arrow navigation smoke
        run: python tests/navigation_smoke.py
      - name: Windows panels and unified palette smoke
        run: python tests/windows_features_smoke.py
